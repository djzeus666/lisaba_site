services:
  lisaba-site:
    build: .
    container_name: lisaba-site
    restart: unless-stopped
    ports:
      - "3080:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:/app/data/payload.db
    volumes:
      - lisaba-data:/app/data
      - lisaba-media:/app/media

volumes:
  lisaba-data:
  lisaba-media:
